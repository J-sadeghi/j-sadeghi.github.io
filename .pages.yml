# Pages CMS configuration (https://pagescms.org)
# Defines the editing forms you see at app.pagescms.org
media:
  input: img
  output: /img
content:
- name: settings
  label: Site settings
  type: file
  path: _data/settings.yml
  format: yaml
  fields:
  - name: site_name
    label: Site name (top-left of the menu bar and browser tab)
    type: string
  - name: description
    label: Short site description (for search engines)
    type: string
  - name: favicon
    label: Browser tab icon (small square image)
    type: image
  - name: accent_color
    label: 'Link colour (e.g. #0095eb)'
    type: string
  - name: copyright_text
    label: Footer text (e.g. © 2026 Jafar Sadeghi)
    type: string
  - name: show_latest_update
    label: 'Footer: show "Latest update" month'
    type: boolean
  - name: show_theme_credit
    label: 'Footer: show "Powered by the Academic theme"'
    type: boolean
  - name: show_back_to_top
    label: 'Footer: show the back-to-top arrow'
    type: boolean
  - name: show_page_dates
    label: Show "Last updated" date on pages
    type: boolean
- name: home
  label: Home page
  type: file
  path: index.md
  format: yaml-frontmatter
  fields:
  - name: layout
    type: string
    hidden: true
  - name: title
    type: string
    hidden: true
  - name: name
    label: Name
    type: string
  - name: job_title
    label: Job title
    type: string
  - name: affiliation
    label: Affiliation (shown under your name)
    type: string
  - name: affiliation_url
    label: Affiliation web address
    type: string
  - name: portrait
    label: Photo (square works best)
    type: image
  - name: cv
    label: CV (PDF)
    type: file
  - name: cv_prefix
    label: 'Text before the CV link (default: Complete)'
    type: string
  - name: cv_label
    label: 'CV link text (default: Curriculum Vitae)'
    type: string
  - name: google_scholar
    label: Google Scholar link
    type: string
  - name: orcid
    label: ORCID link
    type: string
  - name: researchgate
    label: ResearchGate link (optional)
    type: string
  - name: linkedin
    label: LinkedIn link (optional)
    type: string
  - name: email
    label: E-mail address (for the envelope icon)
    type: string
  - name: extra_links
    label: More profile links (icons under your photo)
    type: object
    list: true
    fields:
    - name: label
      label: Name (e.g. Scopus)
      type: string
    - name: icon
      label: Icon
      type: select
      options:
        values:
        - ai-google-scholar
        - ai-orcid
        - ai-researchgate
        - ai-semantic-scholar
        - ai-dblp
        - ai-arxiv
        - ai-publons
        - ai-researcherid
        - ai-ideas-repec
        - ai-mendeley
        - ai-cv
        - fa-linkedin
        - fa-github
        - fa-twitter
        - fa-globe
        - fa-file-pdf-o
        - fa-envelope
        - fa-youtube
    - name: url
      label: Link (full web address)
      type: string
  - name: bio_heading
    label: 'Biography heading (default: Short Biography)'
    type: string
  - name: body
    label: Short biography
    type: rich-text
    options:
      format: markdown
  - name: interests_heading
    label: 'Interests heading (default: Interests)'
    type: string
  - name: interests
    label: Interests
    type: string
    list: true
  - name: education_heading
    label: 'Education heading (default: Education)'
    type: string
  - name: education
    label: Education
    type: object
    list: true
    fields:
    - name: degree
      label: Degree and year
      type: string
    - name: institution
      label: Institution
      type: string
  - name: contact_heading
    label: 'Contact heading (default: Contact)'
    type: string
  - name: hide_contact
    label: Hide the whole Contact section
    type: boolean
  - name: contact
    label: Contact section
    type: object
    fields:
    - name: email_display
      label: E-mail as shown (e.g. name at rmc dot ca)
      type: string
    - name: department
      label: Department
      type: string
    - name: address
      label: Address
      type: string
    - name: hours
      label: Office hours / availability
      type: string
  - name: extra_contact
    label: More contact lines
    type: object
    list: true
    fields:
    - name: icon
      label: Icon
      type: select
      options:
        values:
        - fa-envelope
        - fa-phone
        - fa-map-marker
        - fa-university
        - fa-clock-o
        - fa-building
        - fa-globe
        - fa-skype
        - fa-info-circle
    - name: text
      label: Text
      type: string
- name: articles
  label: Journal articles
  type: file
  path: _data/articles.yml
  format: yaml
  list: true
  fields:
  - name: authors
    label: Authors (e.g. K. Kerstens and J. Sadeghi)
    type: string
    required: true
  - name: title
    label: Title
    type: string
    required: true
  - name: venue
    label: Journal / conference (shown in italics)
    type: string
  - name: details
    label: Volume(issue):pages, place, or status
    type: string
  - name: year
    label: Year (or date)
    type: string
  - name: note
    label: Note (e.g. Forthcoming)
    type: string
  - name: link
    label: Link or DOI (optional)
    type: string
  - name: hide
    label: Hide from website (keeps it saved here)
    type: boolean
- name: preprints
  label: Preprints
  type: file
  path: _data/preprints.yml
  format: yaml
  list: true
  fields:
  - name: authors
    label: Authors (e.g. K. Kerstens and J. Sadeghi)
    type: string
    required: true
  - name: title
    label: Title
    type: string
    required: true
  - name: venue
    label: Journal / conference (shown in italics)
    type: string
  - name: details
    label: Volume(issue):pages, place, or status
    type: string
  - name: year
    label: Year (or date)
    type: string
  - name: note
    label: Note (e.g. Forthcoming)
    type: string
  - name: link
    label: Link or DOI (optional)
    type: string
  - name: hide
    label: Hide from website (keeps it saved here)
    type: boolean
- name: conferences
  label: Conference presentations
  type: file
  path: _data/conferences.yml
  format: yaml
  list: true
  fields:
  - name: authors
    label: Authors (e.g. K. Kerstens and J. Sadeghi)
    type: string
    required: true
  - name: title
    label: Title
    type: string
    required: true
  - name: venue
    label: Journal / conference (shown in italics)
    type: string
  - name: details
    label: Volume(issue):pages, place, or status
    type: string
  - name: year
    label: Year (or date)
    type: string
  - name: note
    label: Note (e.g. Forthcoming)
    type: string
  - name: link
    label: Link or DOI (optional)
    type: string
  - name: hide
    label: Hide from website (keeps it saved here)
    type: boolean
- name: seminars
  label: Invited seminars
  type: file
  path: _data/seminars.yml
  format: yaml
  list: true
  fields:
  - name: authors
    label: Authors (e.g. K. Kerstens and J. Sadeghi)
    type: string
    required: true
  - name: title
    label: Title
    type: string
    required: true
  - name: venue
    label: Journal / conference (shown in italics)
    type: string
  - name: details
    label: Volume(issue):pages, place, or status
    type: string
  - name: year
    label: Year (or date)
    type: string
  - name: note
    label: Note (e.g. Forthcoming)
    type: string
  - name: link
    label: Link or DOI (optional)
    type: string
  - name: hide
    label: Hide from website (keeps it saved here)
    type: boolean
- name: group
  label: Research group
  type: file
  path: _data/group.yml
  format: yaml
  fields:
  - name: current_heading
    label: 'Heading for current members (default: Current Members)'
    type: string
  - name: sections
    label: Current members (by level)
    type: object
    list: true
    fields:
    - name: heading
      label: Heading (e.g. Graduate Students)
      type: string
    - name: members
      label: Members
      type: object
      list: true
      fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: degree
        label: Degree (e.g. MSc
        type: string
      - name: project
        label: Project title
        type: string
      - name: details
        label: Funding / years / other details
        type: string
      - name: hide
        label: Hide from website (keeps it saved here)
        type: boolean
    - name: hide
      label: Hide this whole level
      type: boolean
  - name: alumni_heading
    label: 'Heading for former members (default: Former Members)'
    type: string
  - name: alumni
    label: Former members
    type: object
    list: true
    fields:
    - name: name
      label: Name
      type: string
      required: true
    - name: degree
      label: Degree (e.g. MSc
      type: string
    - name: project
      label: Project title
      type: string
    - name: details
      label: Funding / years / other details
      type: string
    - name: hide
      label: Hide from website (keeps it saved here)
      type: boolean
- name: pages
  label: Pages (text pages)
  type: collection
  path: pages
  format: yaml-frontmatter
  filename: '{slug}.md'
  fields:
  - name: title
    label: Page title
    type: string
    required: true
  - name: hide
    label: Hide this page from website (keeps it saved here)
    type: boolean
  - name: hide_date
    label: Hide the "Last updated" date on this page
    type: boolean
  - name: layout
    type: select
    label: Page type
    options:
      values:
      - page
      - publications
      - group
  - name: sections
    type: object
    list: true
    fields:
    - name: heading
      label: Section heading
      type: string
    - name: data
      label: Which list
      type: select
      options:
        values:
        - articles
        - preprints
        - conferences
        - seminars
    label: Publication lists shown on this page (only for publication pages)
  - name: footer_note
    label: Note at the bottom (optional)
    type: string
  - name: body
    label: Page text
    type: rich-text
    options:
      format: markdown
- name: navigation
  label: Menu
  type: file
  path: _data/navigation.yml
  format: yaml
  list: true
  fields:
  - name: title
    label: Menu label
    type: string
  - name: url
    label: Link (e.g. /post/courses/ ; leave empty for a drop-down)
    type: string
  - name: hide
    label: Hide this menu item
    type: boolean
  - name: children
    label: Drop-down items
    type: object
    list: true
    fields:
    - name: title
      label: Label
      type: string
    - name: url
      label: Link (e.g. /post/articles/)
      type: string
    - name: hide
      label: Hide this item
      type: boolean
