<!DOCTYPE html>
<html lang="en-us">
<head>
  {% assign S = site.data.settings %}{% assign site_name = S.site_name | default: site.title %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="author" content="{{ site_name }}">
  <meta name="description" content="{{ page.description | default: S.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/bootstrap/css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/academicons/css/academicons.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/font-awesome/css/font-awesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700%7cRoboto:400,400italic,700%7cRoboto+Mono">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ S.favicon | default: '/img/icon.png' | relative_url }}">
  {% if page.hide %}<meta name="robots" content="noindex">{% endif %}
  <title>{% if page.url == '/' %}{{ site_name }}{% else %}{{ page.title }} | {{ site_name }}{% endif %}</title>
  {% if S.accent_color and S.accent_color != "" %}<style>
    a, a:hover, a:focus, .navbar-default .navbar-nav>li>a:hover, .dropdown-menu>li>a:hover, .dropdown-menu>li>a:focus,
    .article-metadata a:hover, #profile .network-icon a { color: {{ S.accent_color }}; }
  </style>{% endif %}
</head>
